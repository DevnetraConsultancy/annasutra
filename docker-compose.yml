services:
  mysql:
    image: mysql:8.0
    container_name: annasutra-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: annasutra_db
      MYSQL_USER: annasutra
      MYSQL_PASSWORD: annasutra_password
    command: >
      --default-authentication-plugin=mysql_native_password
      --log-bin-trust-function-creators=1
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "annasutra", "-pannasutra_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annasutra-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: mysql://annasutra:annasutra_password@mysql:3306/annasutra_db
      DJANGO_SECRET_KEY: annasutra-docker-dev-secret-key-391823901
      DJANGO_DEBUG: "True"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  mysql_data:
