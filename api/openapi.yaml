components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: &id002
        type: string
        format: uuid
      description: Same key returns the same result; sending twice stores once.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema: *id001
  schemas:
    Problem:
      type: object
      properties:
        type: *id001
        title: *id001
        status:
          type: integer
        detail: *id001
        code: *id001
      required:
      - title
      - status
      - code
    OtpRequest:
      type: object
      properties:
        phone: *id001
        language: *id001
      required:
      - phone
    OtpVerify:
      type: object
      properties:
        phone: *id001
        code: *id001
        device_public_key: *id001
        device_label: *id001
      required:
      - phone
      - code
    TokenPair:
      type: object
      properties:
        access_token: *id001
        refresh_token: *id001
        expires_in:
          type: integer
        org_verification: *id001
      required:
      - access_token
      - refresh_token
    RefreshRequest:
      type: object
      properties:
        refresh_token: *id001
      required:
      - refresh_token
    WebAuthnOptions:
      type: object
      properties:
        options:
          type: object
    WebAuthnResult:
      type: object
      properties:
        credential:
          type: object
      required:
      - credential
    DeviceRegister:
      type: object
      properties:
        public_key: *id001
        key_alg: *id001
        label: *id001
      required:
      - public_key
    Device:
      type: object
      properties:
        device_id: *id002
        label: *id001
        created_at: &id003
          type: string
          format: date-time
        revoked_at: *id003
    OrgRegister:
      type: object
      properties:
        name: *id001
        org_type:
          type: string
          enum:
          - FARMER
          - AGGREGATOR
          - WHOLESALER
          - DISTRIBUTOR
          - RETAILER
        fssai_no: *id001
        consent_notice_version: *id001
        consent_language: *id001
      required:
      - name
      - org_type
      - consent_notice_version
    Org:
      type: object
      properties:
        org_id: *id002
        name: *id001
        org_type: *id001
        verification: *id001
    PartnerInvite:
      type: object
      properties:
        to_org_id: *id002
      required:
      - to_org_id
    Partner:
      type: object
      properties:
        org_id: *id002
        name: *id001
        status: *id001
    LabelBlockRequest:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 500
      required:
      - count
    LabelBlock:
      type: object
      properties:
        block_id: *id002
        serials:
          type: array
          items: *id001
    EventBase:
      type: object
      properties:
        event_id: *id002
        event_time: *id003
        facility_id: *id002
        on_behalf_of_org_id: *id002
        device_signature: *id001
        evidence_ids:
          type: array
          items: *id002
      required:
      - event_id
      - event_time
    LotCreate:
      type: object
      properties:
        event_id: *id002
        label_serial: *id001
        plot_id: *id002
        product:
