<svg xmlns="http://www.w3.org/2000/svg" width="730" height="900" viewBox="0 0 730 900" role="img"><title>QR label lifecycle</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20" y="26" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2C2C2A">QR label lifecycle</text><rect x="215.0" y="60" width="300" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="365.0" y="83.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#712B13">Admin issues serial block</text><text x="365.0" y="101.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#993C1D">To a verified business</text><path d="M365.0 112 L365.0 141" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="215.0" y="144" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="365.0" y="171.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Serial status: ISSUED</text><path d="M365.0 188 L365.0 217" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="215.0" y="220" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="365.0" y="243.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">User scans blank sticker</text><text x="365.0" y="261.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">and creates a batch</text><path d="M365.0 272 L365.0 301" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><polygon points="365.0,304.0 490.0,346.0 365.0,388.0 240.0,346.0" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.2"/><text x="365.0" y="351.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Serial unused?</text><path d="M490.0 346.0 L523.0 346.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="508.0" y="338.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">No</text><rect x="526.0" y="317.0" width="160" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="606.0" y="343.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Reject</text><text x="606.0" y="361.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">Pick another</text><path d="M365.0 388 L365.0 417" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="373.0" y="408" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#5F5E5A">Yes</text><rect x="215.0" y="420" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="365.0" y="447.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">Serial BOUND to the batch</text><path d="M365.0 464 L365.0 493" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="215.0" y="496" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="365.0" y="519.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">Same QR stays on the batch</text><text x="365.0" y="537.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Dispatch, receive, store, repack</text><path d="M365.0 548 L365.0 577" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><polygon points="365.0,580.0 490.0,622.0 365.0,664.0 240.0,622.0" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.2"/><text x="365.0" y="627.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Label intact?</text><path d="M490.0 622.0 L523.0 622.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="508.0" y="614.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">No</text><rect x="526.0" y="593.0" width="160" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="606.0" y="619.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Reissue</text><text x="606.0" y="637.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">Void old, bind new</text><path d="M365.0 664 L365.0 693" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="373.0" y="684" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#5F5E5A">Yes</text><polygon points="365.0,696.0 490.0,738.0 365.0,780.0 240.0,738.0" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.2"/><text x="365.0" y="743.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Lot kept whole?</text><path d="M490.0 738.0 L523.0 738.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="508.0" y="730.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">No</text><rect x="526.0" y="709.0" width="160" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="606.0" y="735.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">New QR each lot</text><text x="606.0" y="753.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">Linked to parents</text><path d="M365.0 780 L365.0 809" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="373.0" y="800" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#5F5E5A">Yes</text><rect x="215.0" y="812" width="300" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="365.0" y="835.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3C3489">Shelf QR points to retail lot</text><text x="365.0" y="853.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#534AB7">Public page shows summary</text></svg>