<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img"><title>Lot state machine</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20" y="26" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2C2C2A">Batch (lot) states</text><rect x="40" y="70" width="140" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="110.0" y="100.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Created</text><rect x="270" y="70" width="140" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="340.0" y="100.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">In transit</text><rect x="500" y="70" width="140" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="570.0" y="100.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">In custody</text><path d="M180 95 L266 95" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="223" y="86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">dispatch</text><path d="M410 95 L496 95" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="453" y="86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">receive</text><path d="M570 70 L570 44 L340 44 L340 66" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="455" y="38" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">dispatch onward</text><rect x="270" y="210" width="140" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="340.0" y="240.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#712B13">Disputed</text><path d="M340 120 L340 206" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="352" y="168" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#5F5E5A">numbers differ</text><path d="M410 235 L520 235 L520 124" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="465" y="227" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">resolved</text><rect x="500" y="340" width="140" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="570.0" y="370.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3C3489">Closed</text><path d="M610 120 L610 336" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="620" y="230" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#5F5E5A">split, sold, empty</text><rect x="40" y="340" width="400" height="62" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6 4"/><text x="240.0" y="360.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">In transit too long</text><text x="240.0" y="378.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">Handover expires, gap flagged,</text><text x="240.0" y="394.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">last holder stays responsible</text><rect x="40" y="416" width="400" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6 4"/><text x="240.0" y="443.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Recalled</text><text x="450" y="443" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#5F5E5A">can be set on any state; holders notified; history kept</text></svg>