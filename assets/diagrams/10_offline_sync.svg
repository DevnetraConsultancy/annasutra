<svg xmlns="http://www.w3.org/2000/svg" width="730" height="624" viewBox="0 0 730 624" role="img"><title>Offline-first sync</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20" y="26" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2C2C2A">Offline-first sync</text><rect x="215.0" y="60" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="365.0" y="87.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">User does an action</text><path d="M365.0 104 L365.0 133" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="215.0" y="136" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="365.0" y="159.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">Save event + outbox row</text><text x="365.0" y="177.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">One local transaction</text><path d="M365.0 188 L365.0 217" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><polygon points="365.0,220.0 490.0,262.0 365.0,304.0 240.0,262.0" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.2"/><text x="365.0" y="267.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Online?</text><path d="M490.0 262.0 L523.0 262.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="508.0" y="254.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">No</text><rect x="526.0" y="233.0" width="160" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="606.0" y="259.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Wait, retry</text><text x="606.0" y="277.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">Backoff, no data loss</text><path d="M365.0 304 L365.0 333" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="373.0" y="324" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#5F5E5A">Yes</text><rect x="215.0" y="336" width="300" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="365.0" y="359.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">Send with event ID</text><text x="365.0" y="377.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Resending is safe</text><path d="M365.0 388 L365.0 417" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><polygon points="365.0,420.0 490.0,462.0 365.0,504.0 240.0,462.0" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.2"/><text x="365.0" y="467.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">Server accepts?</text><path d="M490.0 462.0 L523.0 462.0" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><text x="508.0" y="454.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">No</text><rect x="526.0" y="433.0" width="160" height="58" rx="8" fill="#F1E