<svg xmlns="http://www.w3.org/2000/svg" width="680" height="608" viewBox="0 0 680 608" role="img"><title>Security layers</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20" y="26" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2C2C2A">Eight security layers: defence in depth</text><rect x="60" y="50" width="560" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="340.0" y="73.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#712B13">1. Edge</text><text x="340.0" y="91.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#993C1D">Cloudflare: bot checks, firewall, rate limits</text><rect x="60" y="116" width="560" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="340.0" y="139.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">2. Identity</text><text x="340.0" y="157.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">SMS code, passkey or device key, no passwords</text><rect x="60" y="182" width="560" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="340.0" y="205.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">3. Sessions and devices</text><text x="340.0" y="223.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Short sessions, revoke a lost phone</text><rect x="60" y="248" width="560" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="340.0" y="271.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">4. Access control</text><text x="340.0" y="289.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Organisation-scoped checks + database row security</text><rect x="60" y="314" width="560" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="340.0" y="337.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">5. Data protection</text><text x="340.0" y="355.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Encrypted in transit and at rest, field-level keys</text><rect x="60" y="380" width="560" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="340.0" y="403.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#712B13">6. Integrity</text><text x="340.0" y="421.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#993C1D">Append-only events, hash chain, daily external copy</text><rect x="60" y="446" width="560" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="340.0" y="469.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#712B13">7. Operations</text><text x="340.0" y="487.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#993C1D">Logs in India 180 days, alerts, 6-hour incident clock</text><rect x="60" y="512" width="560" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="340.0" y="535.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2C2C2A">8. People and process</text><text x="340.0" y="553.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#5F5E5A">Two-party confirmation, audits, training</text></svg>