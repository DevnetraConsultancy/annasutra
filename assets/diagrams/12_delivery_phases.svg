<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="230" viewBox="0 0 1060 230" role="img"><title>Delivery phases</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20" y="26" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2C2C2A">Delivery phases</text><rect x="20" y="60" width="188" height="104" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="114.0" y="93.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">P0 Foundation</text><text x="114.0" y="111.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Repo, CI, API contract</text><text x="114.0" y="127.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Backend skeleton</text><text x="114.0" y="143.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Design system</text><path d="M210 112 L225 112" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="228" y="60" width="188" height="104" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="322.0" y="93.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">P1 Identity + batch</text><text x="322.0" y="111.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Login, verification</text><text x="322.0" y="127.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Create batch</text><text x="322.0" y="143.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Bind QR sticker</text><path d="M418 112 L433 112" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="436" y="60" width="188" height="104" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="530.0" y="93.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">P2 Handover chain</text><text x="530.0" y="111.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Dispatch, receive</text><text x="530.0" y="127.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Disputes, gaps</text><text x="530.0" y="143.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Offline sync</text><path d="M626 112 L641 112" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="644" y="60" width="188" height="104" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="738.0" y="93.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">P3 Genealogy</text><text x="738.0" y="111.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Split, merge, sort</text><text x="738.0" y="127.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Inspections, photos</text><text x="738.0" y="143.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Recall, alerts</text><path d="M834 112 L849 112" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="852" y="60" width="188" height="104" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="946.0" y="93.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3C3489">P4 Pilot ready</text><text x="946.0" y="111.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#534AB7">Penetration test</text><text x="946.0" y="127.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#534AB7">Restore drill</text><text x="946.0" y="143.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#534AB7">Store release</text><text x="530.0" y="200" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A">Each phase ends with: tests pass, human review done, demo on a real low-cost phone.</text></svg>