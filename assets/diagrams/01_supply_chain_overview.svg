<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="250" viewBox="0 0 1060 250" role="img"><title>AnnaSutra supply chain overview</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="20" y="26" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#2C2C2A">Supply chain: every holder approves the next one, every step is recorded forever</text><rect x="20" y="70" width="150" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="95.0" y="101.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">1 Farmer</text><text x="95.0" y="119.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Creates batch</text><text x="95.0" y="135.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Makes the QR</text><path d="M172 112 L187 112" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="190" y="70" width="150" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="265.0" y="101.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">2 Aggregator</text><text x="265.0" y="119.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Scan, weigh,</text><text x="265.0" y="135.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">check quality</text><path d="M342 112 L357 112" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="360" y="70" width="150" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="435.0" y="101.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">3 Wholesaler</text><text x="435.0" y="119.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Grade, split to</text><text x="435.0" y="135.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">buyers</text><path d="M512 112 L527 112" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="530" y="70" width="150" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="605.0" y="101.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">4 Distributor</text><text x="605.0" y="119.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Transport,</text><text x="605.0" y="135.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">split, deliver</text><path d="M682 112 L697 112" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="700" y="70" width="150" height="84" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="775.0" y="101.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#085041">5 Retailer</text><text x="775.0" y="119.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">Shelf QR,</text><text x="775.0" y="135.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#0F6E56">sales, waste</text><path d="M852 112 L867 112" fill="none" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#ah)"/><rect x="870" y="70" width="150" height="84" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="945.0" y="101.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3C3489">6 Consumer</text><text x="945.0" y="119.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#534AB7">Scans shelf QR,</text><text x="945.0" y="135.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#534AB7">reads summary</text><text x="530.0" y="190" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A">Each handover: sender approves the receiver, receiver confirms with biometric or PIN, custody moves.</text><text x="530.0" y="212" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5F5E5A">The consumer can only read a short, safe summary. Nobody can edit old records.</text></svg>