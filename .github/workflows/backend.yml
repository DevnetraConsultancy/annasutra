name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Backend Lint, Migrations, Constraints & Contract Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: annasutra_test
          POSTGRES_USER: annasutra_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://annasutra_user:test_password@localhost:5432/annasutra_test
      SECRET_KEY: ci-test-secret-key-1234567890-minimum-32-chars-long

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint check (Ruff)
        run: |
          ruff check --fix --config pyproject.toml backend/ || true
          ruff check --config pyproject.toml backend/

      - name: Run Django migrations on PostgreSQL 16
        run: |
          python backend/manage.py migrate

      - name: Run Pytest Suite (Health, DB Constraints & OpenAPI Contract)
        run: |
          pytest backend/tests/
