name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Backend Lint, Migrations, Constraints & Contract Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: annasutra_test
          MYSQL_USER: annasutra_user
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: mysql://annasutra_user:test_password@127.0.0.1:3306/annasutra_test
      SECRET_KEY: ci-test-secret-key-1234567890-minimum-32-chars-long

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint check (Ruff)
        run: |
          ruff check --fix --config pyproject.toml backend/ || true
          ruff check --config pyproject.toml backend/

      - name: Run Django migrations on MySQL 8.0
        run: |
          python backend/manage.py migrate

      - name: Run Pytest Suite (Health, DB Constraints & OpenAPI Contract)
        run: |
          pytest backend/tests/
