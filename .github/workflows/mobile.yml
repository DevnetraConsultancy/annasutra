name: Mobile & Web CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Flutter Analyze, Test & Multiplatform Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Scaffold platform targets
        run: |
          flutter create . --platforms web,android --org in.example.annasutra
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format .

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Web application
        run: flutter build web

      - name: Build Android APK (Debug)
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: annasutra-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload Web PWA
        uses: actions/upload-artifact@v4
        with:
          name: annasutra-web-pwa
          path: mobile/build/web
          retention-days: 30
