[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "annasutra-backend"
version = "0.1.0"
description = "AnnaSutra Agri-traceability backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1.2,<5.2.0",
    "djangorestframework>=3.15.2,<3.16.0",
    "pymysql>=1.1.1,<1.2.0",
    "django-environ>=0.11.2,<0.12.0",
    "cryptography>=43.0.1,<44.0.0",
    "webauthn>=2.1.0,<2.6.0",
    "requests>=2.32.3,<2.33.0",
    "pyyaml>=6.0.2,<6.1.0",
    "PyJWT>=2.9.0,<3.0.0",
]

[tool.setuptools]
packages = ["apps", "config"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "venv",
    ".venv",
    "**/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "DJ001", "F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers -v"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
