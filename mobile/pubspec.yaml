name: annasutra_mobile
description: "AnnaSutra Agri-traceability client for Android and Web from one Flutter codebase."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Networking & Serialization
  dio: ^5.7.0
  intl: ^0.19.0
  uuid: ^4.5.1

  # Platform Hardware & Storage
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  mobile_scanner: ^5.2.3
  connectivity_plus: ^6.0.5
  google_sign_in: ^6.2.2
  video_player: ^2.9.5
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
